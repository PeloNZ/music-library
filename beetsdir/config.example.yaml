# beets config template.
#
# Copy this file to config.yaml (in the same beetsdir/ folder) and fill in
# the values marked CHANGE-ME below. config.yaml is gitignored.
# See docs/LIBRARY-LAYOUT.md for the paths: section below.

# --------------- Where things live ---------------

# The NAS share, mounted on this Mac. `musicos preflight` stops a run when
# nothing is mounted here.
directory: /Volumes/music

# Relative paths resolve inside BEETSDIR (this file's own directory).
library: library.db

# --------------- Plugins ---------------
# The beets extras (chroma, embedart, fetchart, lastgenre) install with
# `uv sync`. `inline` defines the multidisc field used in paths: below.
plugins: >-
  export types missing duplicates unimported musicbrainz smartplaylist
  inline chroma fetchart embedart lastgenre info

# chroma looks fingerprints up with beets' own AcoustID application key, so
# matching needs no key here. `acoustid: apikey:` is a user key that only
# `beet submit` reads, to upload fingerprints. Leave it out.

# --------------- On-disk layout ---------------
# Artist/Album, with the disc number only on multi-disc albums:
#   Opeth/2001 - Blackwater Park/03 The Drapery Falls
#   Opeth/2001 - Blackwater Park/02-03 The Drapery Falls
# Keys other than 'default' are beets queries, tried in the order they
# appear here. First match wins. 'default' is the final fallback.

item_fields:
  multidisc: 1 if disctotal > 1 else 0

paths:
  singleton: $artist/Non-Album/$title
  comp: Various Artists/$album%aunique{}/%if{$multidisc,$disc-}$track $title
  default: $albumartist/$year - $album%aunique{}/%if{$multidisc,$disc-}$track $title

# Files beets skips. This list replaces the beets default, so the default
# entries stay.
ignore:
  - ".*"
  - "*~"
  - System Volume Information
  - lost+found
  - desktop.ini
  - Thumbs.db
  - sync.ffs_db

# Enabling chroma gives beets a second metadata source, and beets then adds a
# fixed "data source" penalty (about 0.03 to 0.12 per album) to every
# MusicBrainz candidate. That alone pushes a perfect match past
# match.strong_rec_thresh (0.04), so an unattended import skips everything.
# Zero removes the offset. The thresholds stay at their defaults.
musicbrainz:
  data_source_mismatch_penalty: 0

# `beet unimported` lists files under directory: that beets does not hold.
# Album art from fetchart is not an item, and the inbox and holding folders
# live next to the library.
unimported:
  ignore_extensions: jpg jpeg png
  ignore_subdirectories: _inbox _holding

# --------------- Machine-readable output ---------------
# Pins export formatting so the musicos commands parse consistently. See
# docs/BEETS-CHEATSHEET.md's export-formatting gotchas.

time_format: '%Y-%m-%d %H:%M:%S'
format_raw_length: yes

# --------------- Playlists (music-playlist) ---------------
# auto: no is deliberate: playlists regenerate when asked, not on every
# database change.

smartplaylist:
  auto: no
  playlist_dir: CHANGE-ME/path/to/where/your/player/reads/playlists
  relative_to: /Volumes/music   # should match directory: above
  playlists: []
    # - name: 'Jazz.m3u'
    #   query: 'genre:jazz'

# --------------- Import behavior ---------------
# copy: yes keeps the original file. Switch to move only after approval.
# Each import run also gets a log: -l beetsdir/logs/import-<batch>.log

import:
  copy: yes
  write: yes
