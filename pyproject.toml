[project]
name = "musicos"
version = "0.1.0"
description = "Repair and organise a music library with beets, driven by Claude Code skills"
requires-python = ">=3.12"
dependencies = [
    "beets[chroma,embedart,fetchart,lastgenre]>=2.14,<3",
    "pyyaml>=6.0.3",
]

[project.scripts]
musicos = "musicos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["musicos"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
